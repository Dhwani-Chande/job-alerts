# ------------------------------------------------------------
# Title matching
# ------------------------------------------------------------
# A job is included if its title matches at least one
# role keyword AND does not match any exclude keyword.
# If require_new_grad_signal is true, the title must ALSO contain a
# new-grad signal — set false to see all matching roles regardless of
# level wording.

role_keywords:
    # Software engineering
    - software engineer
    - software developer
    - swe
    - backend engineer
    - backend developer
    - frontend engineer
    - frontend developer
    - full stack engineer
    - full-stack engineer
    - full stack developer
    - full-stack developer
    - platform engineer
    - infrastructure engineer
    - cloud engineer
    - devops engineer
    - site reliability engineer
    - sre

    # Data roles
    - data engineer
    - analytics engineer
    - database engineer
    - data scientist
    - data analyst

    # AI / ML / research
    - machine learning
    - ml engineer
    - ai engineer
    - applied ai
    - applied machine learning
    - applied scientist
    - research engineer
    - research scientist
    - computer vision
    - 3d vision
    - nlp engineer
    - natural language processing
    - llm engineer
    - generative ai
    - mlops

    # Customer-facing technical roles
    - forward deployed
    - fde
    - deployment engineer
    - solutions engineer

# Internship titles are often broader than full-time titles (for example,
# "AI Intern", "Software Development Intern", or "Data Science Co-op").
# These keywords are used only when the title contains intern/internship/co-op.
internship_role_keywords:
    - software
    - developer
    - development
    - machine learning
    - ml
    - artificial intelligence
    - ai
    - data science
    - data engineer
    - research
    - applied scientist
    - forward deployed
    - deployment
    - solutions engineer
    - backend
    - frontend
    - full stack
    - platform engineer
    - cloud engineer
    - devops
    - infrastructure
    - database
    - computer science
    - data analyst

new_grad_keywords:
    - new grad
    - new graduate
    - university grad
    - early career
    - entry level
    - "2026"
    - campus
    - junior
    - associate

exclude_keywords:
    - senior
    - staff
    - principal
    - lead
    - manager
    - director
    - sr.
    - sr "
    - head of
    - vp

require_new_grad_signal: false # set true once volume gets noisy

# Only keep US-based (or remote-US) roles
us_only: true

# ------------------------------------------------------------
# SimplifyJobs community feeds (cover Big Tech / Workday companies)
# Sources: github.com/SimplifyJobs/New-Grad-Positions and
# github.com/SimplifyJobs/Summer2026-Internships
# These feeds are pre-curated, so role_keywords are NOT applied; instead we
# filter by category, recency, sponsorship, seniority, and a tech-title check.
# ------------------------------------------------------------
simplifyjobs:
    enabled: true
    include_new_grad: true
    include_internships: true
    # Update this URL when SimplifyJobs moves to a new internship-season repo.
    internship_url: https://raw.githubusercontent.com/SimplifyJobs/Summer2026-Internships/dev/.github/scripts/listings.json
    categories: # options seen in feed: Software, AI/ML/Data,
        - Software # Hardware, Quant, Product
        - AI/ML/Data
    max_age_days: 7 # only surface posts from the last N days
    skip_citizenship_required: true # drop "U.S. Citizenship is Required" roles
    # Drop roles the feed explicitly marks "Does Not Offer Sponsorship".
    # Roles offering sponsorship get a ✅ badge + float to the top of the email.
    skip_no_sponsorship: true
