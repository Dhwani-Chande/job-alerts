# Internship / co-op / apprenticeship title matching
# ------------------------------------------------------------
# Internship titles are often phrased differently, so this list includes both
# role names and specialization terms while avoiding overly broad words such
# as only "research" or only "engineering".

internship_role_keywords:
    # Software / backend
    - software engineer
    - software engineering
    - software developer
    - software development
    - backend
    - python
    - api engineer

    # AI / ML / NLP / LLM
    - machine learning
    - artificial intelligence
    - ai
    - ml
    - applied ai
    - generative ai
    - genai
    - llm
    - large language model
    - nlp
    - natural language processing
    - ai evaluation
    - ml evaluation
    - model evaluation

    # Vision / research
    - computer vision
    - 3d vision
    - vision research
    - machine learning research
    - ai research
    - nlp research
    - research engineer
    - research scientist
    - applied scientist

    # Data / ML systems
    - data science
