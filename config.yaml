# Used for sorting and, if require_new_grad_signal is enabled, filtering.
new_grad_keywords:
    - new grad
    - new graduate
    - recent graduate
    - university grad
    - university graduate
    - college grad
    - new college graduate
    - early career
    - entry level
    - entry-level
    - junior
    - associate
    - level 1
    - engineer i
    - scientist i
    - developer i
    - analyst i
    - campus
    - graduate program
    - "2026"
    - "2027"

exclude_keywords:
    # Seniority
    - senior
    - staff
    - principal
    - lead
    - manager
    - director
    - architect
    - distinguished
    - experienced
    - sr.
    - sr "
    - head of
    - vp
    - postdoc
    - phd
    - doctoral

    # Specializations not supported strongly enough by the current resume
    - ios
    - android
    - mobile engineer
    - embedded
    - firmware
    - hardware engineer
    - electrical engineer
    - cybersecurity
    - security engineer
    - network engineer
    - qa engineer
    - quality assurance
    - test engineer
    - product manager
    - program manager
    - sales engineer
    - marketing

# Keep false so an unlevelled title such as "Machine Learning Engineer" or
# "Backend Software Engineer" is still surfaced. The seniority filters above
# remove obvious mid/senior roles.
require_new_grad_signal: false

# Only keep US-based or remote-US roles.
us_only: true

# ------------------------------------------------------------
# SimplifyJobs community feeds
# ------------------------------------------------------------
# The same resume-tailored role keywords are applied to these feeds, rather
# than accepting every role in the broad Software and AI/ML/Data categories.

simplifyjobs:
    enabled: true
    include_new_grad: true
    include_internships: true
    internship_url: https://raw.githubusercontent.com/SimplifyJobs/Summer2026-Internships/dev/.github/scripts/listings.json
    categories:
        - Software
        - AI/ML/Data
    apply_role_keywords: true
    max_age_days: 14
    skip_citizenship_required: true
    skip_no_sponsorship: true
